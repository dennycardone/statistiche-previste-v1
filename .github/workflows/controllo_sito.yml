name: Controllo sito pubblicato
on:
  workflow_dispatch: {}
permissions:
  contents: read
  pages: read
jobs:
  sito:
    runs-on: ubuntu-latest
    steps:
      - name: Cosa serve davvero GitHub Pages (index, basket, sw)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          U=$(gh api repos/${GITHUB_REPOSITORY}/pages --jq .html_url); U=${U%/}/
          for f in "" basket.html sw.js data/basket.json; do
            code=$(curl -s -o out.txt -w '%{http_code} %{size_download} %{url_effective}' -L "${U}${f}?t=$(date +%s)")
            t=$(grep -o '<title>[^<]*' out.txt | head -1 | sed 's/<title>//'); c=$(grep -o 'prevista-v[0-9]*' out.txt | head -1)
            echo "::notice title=${f:-index}::${code#* } · http ${code%% *} · ${t}${c}"
          done
