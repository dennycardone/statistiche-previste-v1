name: Diagnosi quote (solo presenza e orari dei mercati, mai le quote)
on:
  workflow_dispatch:
    inputs:
      date: { description: "giorni (AAAA-MM-GG, separati da virgola)", required: false, default: "" }
      match: { description: "testo da cercare nelle partite (separati da virgola)", required: false, default: "" }
      api: { description: "anche i mercati che API-Football passa oggi (poche richieste dalla riserva per le prove)", required: false, default: "no" }
      tempi: { description: "cosa dà API-Football sul 1° tempo (3 richieste dalla riserva)", required: false, default: "no" }
      basket: { description: "sonda API-Basketball (servizio separato, ~10 richieste sul limite del basket)", required: false, default: "no" }
      loghi: { description: "controllo che i loghi pubblicati si scarichino (nessuna richiesta API)", required: false, default: "no" }
      giocatori: { description: "mercati sui giocatori che API-Football passa (Top 5 + Champions; ~16 richieste dalla riserva)", required: false, default: "no" }
      book: { description: "confronto dei bookmaker (mercati delle statistiche, oggi e domani; fino a 40 richieste dalla riserva)", required: false, default: "no" }
permissions:
  contents: read
jobs:
  diagnosi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archivi dal magazzino privato
        uses: actions/cache/restore@v4
        with:
          path: data
          key: dati-${{ github.run_id }}
          restore-keys: dati-
      - name: Diagnosi
        run: python3 tools/diagnosi_quote.py
        env:
          DIAG_DATE: ${{ inputs.date }}
          DIAG_MATCH: ${{ inputs.match }}
      - name: Mercati 1xBet che API-Football passa oggi (nomi, mai quote)
        if: inputs.api == 'si'
        run: python3 tools/diagnosi_api_quote.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      - name: Confronto dei bookmaker (nomi dei mercati, mai quote)
        if: inputs.book == 'si'
        run: python3 tools/diagnosi_bookmaker.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      - name: Dati del 1° tempo su API-Football (nomi e conteggi)
        if: inputs.tempi == 'si'
        run: python3 tools/diagnosi_tempi.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      - name: Mercati sui giocatori (nomi, mai quote)
        if: inputs.giocatori == 'si'
        run: python3 tools/props/sonda_quote.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      - name: Loghi scaricabili
        if: inputs.loghi == 'si'
        run: |
          mkdir -p _d && git fetch -q --depth 1 origin pages && git archive FETCH_HEAD data | tar -x -C _d
          python3 tools/controllo_loghi.py _d/data
      - name: Sonda basket
        if: inputs.basket == 'si'
        run: python3 tools/sonda_basket.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
