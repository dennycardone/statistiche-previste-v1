name: Sonda statistiche (temporanea)
on:
  push:
    branches: [main]
    paths: [.github/workflows/sonda.yml]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prova statistiche partita ESPN
        run: |
          python3 - <<'PY'
          import json, urllib.request, time
          def get(u):
              r = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
              return json.loads(urllib.request.urlopen(r, timeout=30).read().decode())
          B = "https://site.api.espn.com/apis/site/v2/sports/soccer/"
          out = []
          days = ["20260201","20260202","20260207","20260208","20260214","20260215","20260221","20260222","20260228","20260301","20260307","20260308"]
          for lg in ["ita.1", "eng.1"]:
              for d in days:
                  try: ev = get(f"{B}{lg}/scoreboard?dates={d}").get("events", [])
                  except Exception: continue
                  for e in ev:
                      try:
                          s = get(f"{B}{lg}/summary?event={e['id']}"); c = e["competitions"][0]
                          side = {x["homeAway"]: x["team"]["displayName"] for x in c["competitors"]}
                          st = {t["team"]["displayName"]: {x["name"]: x.get("displayValue") for x in t.get("statistics", [])} for t in s.get("boxscore", {}).get("teams", [])}
                          out.append({"lg": lg, "date": e["date"], "home": side["home"], "away": side["away"], "stats": st})
                      except Exception: pass
                      time.sleep(0.25)
          json.dump(out, open("sonda.json", "w"), ensure_ascii=False)
          PY
      - name: Salva
        run: |
          git config user.name "corner-bot"; git config user.email "corner-bot@users.noreply.github.com"
          git add -f sonda.json; git commit -m "Sonda statistiche (temporanea)"; git pull --rebase origin main; git push
