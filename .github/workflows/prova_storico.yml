name: Prova registro Operatività (anteprima, nessuna pubblicazione sul sito)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archivi dal magazzino privato
        uses: actions/cache/restore@v4
        with:
          path: data
          key: dati-${{ github.run_id }}
          restore-keys: dati-
      - name: Codice dell'anteprima e coefficienti
        run: |
          git fetch -q --depth 1 origin anteprima-registro && git show FETCH_HEAD:index.html > index.html && git show FETCH_HEAD:tools/operativita_ieri.js > tools/operativita_ieri.js
          git fetch -q --depth 1 origin corretta && git show FETCH_HEAD:corretta.json > data/corretta.json
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python3 tools/esiti_extra.py data/bundle_storico.json data/bundle.json
        continue-on-error: true
      - run: node tools/operativita_ieri.js
      - name: Risultato sul ramo prova-registro
        run: |
          mkdir -p _p && cp data/operativita.json data/operativita_ieri.json _p/ && cd _p && git init -q -b prova-registro && git config user.name "corner-bot" && git config user.email "corner-bot@users.noreply.github.com"
          git add -A && git commit -q -m prova && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prova-registro
