name: Basket · aggiornamento (risultati, statistiche, falli, quote, sito)
on:
  schedule:
    - cron: "7,37 * * * *"   # 16/11/2026 (Denny: come il calcio): ogni 30 minuti; risultati e statistiche delle partite finite, falli, quote (le vicine ogni 30', le altre ogni 3 ore)
  workflow_dispatch: {}
concurrency:
  group: basket
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Risultati e statistiche delle partite finite (ramo basket, poche richieste)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _arch && git fetch -q --depth 1 origin basket && git archive FETCH_HEAD | tar -x -C _arch
          python3 tools/basket/archivio.py _arch 200 || echo "::warning::archivio basket non aggiornato"
          rm -rf _ab && cp -r _arch _ab && cd _ab && n=$(ls *.json | wc -l) && [ "$n" -ge 1 ] && git init -q -b basket && git config user.name "corner-bot" && git config user.email "corner-bot@users.noreply.github.com" \
            && git add -A && git commit -q -m "Basket $(date -u '+%F %H:%M')" && for t in 1 2 3; do git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" basket && break; sleep 20; done
      - name: Falli delle partite nuove (ESPN NBA, Eurolega/Eurocup; ramo basket-falli)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FALLI_MINUTI: "4"
        run: |
          mkdir -p _falli && (git fetch -q --depth 1 origin basket-falli && git archive FETCH_HEAD | tar -x -C _falli) || true
          python3 tools/basket/falli.py _arch _falli 150
          rm -rf _fb && cp -r _falli _fb && cd _fb && git init -q -b basket-falli && git config user.name "corner-bot" && git config user.email "corner-bot@users.noreply.github.com" \
            && git add -A && git commit -q -m "Falli basket $(date -u '+%F %H:%M')" && for t in 1 2 3; do git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" basket-falli && break; sleep 20; done
      - name: Archivio cifrato (ramo basket-quote)
        env:
          BK: ${{ secrets.BACKUP_KEY || secrets.APIFOOTBALL_KEY }}
        run: |
          mkdir -p _q
          if git ls-remote --exit-code origin basket-quote >/dev/null 2>&1; then
            git fetch -q --depth 1 origin basket-quote && git archive FETCH_HEAD | tar -x -C _q
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BK -in _q/quote.enc | gunzip > quote_basket.json
          fi
      - name: Quote di oggi e domani
        run: python3 tools/basket/quote.py quote_basket.json 250
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      - name: Salva cifrato
        env:
          GH_TOKEN: ${{ github.token }}
          BK: ${{ secrets.BACKUP_KEY || secrets.APIFOOTBALL_KEY }}
        run: |
          rm -rf _q2 && mkdir _q2
          gzip -c quote_basket.json | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BK -out _q2/quote.enc
          date -u '+%F %H:%M UTC' > _q2/data.txt
          cd _q2 && git init -q -b basket-quote && git config user.name "corner-bot" && git config user.email "corner-bot@users.noreply.github.com" \
            && git add -A && git commit -q -m "Quote basket $(date -u '+%F %H:%M')" \
            && for t in 1 2 3; do git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" basket-quote && break; sleep 20; done
      - name: File del sito (previsioni, linee del giorno, grado, classifiche) sul ramo basket-sito
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf _s && mkdir _s && python3 tools/basket/pubblica.py _arch quote_basket.json _s/basket.json _falli
          cd _s && git init -q -b basket-sito && git config user.name "corner-bot" && git config user.email "corner-bot@users.noreply.github.com" \
            && git add -A && git commit -q -m "Basket sito $(date -u '+%F %H:%M')" \
            && for t in 1 2 3; do git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" basket-sito && break; sleep 20; done
      - name: Mercati giocatori (Player Runs = rimbalzi o assist?) contro le medie dell'archivio
        continue-on-error: true
        run: python3 tools/basket/sonda_runs.py _arch quote_basket.json
