name: Basket · archivio
on:
  schedule:
    - cron: "40 5 * * *"   # ogni mattina: partite finite nella notte (NBA) e stagione in corso
  workflow_dispatch:
    inputs:
      max: { description: "richieste massime in questo giro (limite basket 7.500 al giorno, riserva 800)", required: false, default: "6000" }
concurrency:
  group: basket
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  archivio:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Archivio già scaricato (ramo basket)
        run: |
          mkdir -p basket
          if git ls-remote --exit-code origin basket >/dev/null 2>&1; then git fetch -q --depth 1 origin basket && git archive FETCH_HEAD | tar -x -C basket; fi
          echo "file presenti: $(ls basket/*.json 2>/dev/null | wc -l)"
      - name: Scarica (partite, statistiche di squadra e giocatori)
        run: python3 tools/basket/archivio.py basket "${{ inputs.max || '1500' }}"
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      - name: Salva sul ramo basket
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd basket
          n=$(ls *.json 2>/dev/null | wc -l); echo "file $n"; [ "$n" -ge 1 ] || { echo "::error::archivio basket vuoto, non salvato"; exit 1; }
          git init -q -b basket && git config user.name "corner-bot" && git config user.email "corner-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Basket $(date -u '+%F %H:%M')"
          for t in 1 2 3; do git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" basket && break; sleep 20; done
