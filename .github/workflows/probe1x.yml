name: Prova 1xBet API-Football
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/probe_1xbet.py
      - run: python tools/probe_1xbet.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          BOOK: Pinnacle
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
