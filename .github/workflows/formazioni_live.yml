name: Formazioni ufficiali (micro-processo)
# 26/10/2026 (approvato da Denny): prende solo le formazioni delle partite che iniziano entro 65 minuti; se non c'è niente da fare non fa
# richieste API. Pubblica subito la correzione dei falli sul sito (data/formazioni.json), senza aspettare l'aggiornamento principale.
# 27/10/2026: GitHub fa partire i giri programmati con 30-40 minuti di ritardo e a volte per ore nessuno (27/10: nessun giro dalle 6:00
# alle 8:36). Ora un giro resta attivo fino a ~5 ore e 45 minuti e controlla ogni 5 minuti (tools/formazioni_loop.sh); i giri
# programmati ogni 30 minuti servono solo a farne ripartire uno nuovo quando il precedente finisce (mai due insieme). Lo stesso giro
# fa partire l'aggiornamento principale se l'ultimo è partito più di 30 minuti fa (quote e risultati sempre freschi).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
concurrency:
  group: formazioni-live
  cancel-in-progress: false
permissions:
  contents: write
  actions: write   # per far partire l'aggiornamento principale quando GitHub salta i suoi giri
jobs:
  xi:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1, sparse-checkout: "xi_corr.py\ntools/formazioni_live.py\ntools/formazioni_loop.sh", sparse-checkout-cone-mode: false }
      - name: Controllo ogni 5 minuti per quasi 6 ore
        run: bash tools/formazioni_loop.sh
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          GH_TOKEN: ${{ github.token }}
