name: Prova API-Football
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dati football-data dal ramo pages (per il confronto)
        run: |
          git fetch -q --depth 1 origin pages
          git checkout FETCH_HEAD -- data && git reset -q -- data
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/probe_apifootball.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      - name: Salva il risultato sul ramo probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _p && cp probe/apifootball.json _p/ && cd _p
          git init -q -b probe && git config user.name "corner-bot" && git config user.email "corner-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Prova API-Football $(date -u '+%F %H:%M')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe
