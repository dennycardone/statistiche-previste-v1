name: Studio del sistema di gioco (solo numeri aggregati)
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [tools/sistema.py]
permissions:
  contents: read
jobs:
  sistema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archivi dal magazzino privato
        uses: actions/cache/restore@v4
        with:
          path: data
          key: dati-${{ github.run_id }}
          restore-keys: dati-
      - name: Dati pubblicati e statistiche per tempo
        run: |
          mkdir -p pub tempi && git fetch -q --depth 1 origin pages
          for f in bundle extra tiri_area fuorigioco tempi; do git show FETCH_HEAD:data/$f.json > pub/$f.json; done
          git show FETCH_HEAD:data/bundle_storico.json > pub/bundle_storico.json 2>/dev/null || rm -f pub/bundle_storico.json
          git fetch -q --depth 1 origin tempi && git archive FETCH_HEAD | tar -x -C tempi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -q numpy
      - run: python3 tools/esiti_extra.py
        continue-on-error: true
      - name: 1X2 delle statistiche (probabilità di Prevista con i soli dati precedenti)
        run: node tools/quota23.js .
      - name: Over/Under delle statistiche (linea 1xBet più equilibrata)
        run: node tools/radar_mercato.js . > /dev/null
        env: { RM_DUMP: rm_all.json }
      - name: Studio
        run: python3 tools/sistema.py
