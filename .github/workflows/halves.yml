name: Statistiche per tempo API-Football
on:
  workflow_dispatch: {}
  schedule:
    - cron: "25 23 * * *"   # dopo l'ultimo giro dell'app (23:17 UTC): richieste avanzate dopo la riserva (tools/af_budget.py)
    - cron: "35 0 * * *"    # 28/10/2026: secondo giro dopo l'azzeramento delle richieste (mezzanotte UTC), sempre dentro la riserva
concurrency:   # 28/10/2026: mai insieme agli altri download notturni (leggerebbero la stessa disponibilità di richieste)
  group: notte-api
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  halves:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Archivio partite dal magazzino privato di GitHub Actions (dal 7/10 non è più sul sito pubblico)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: dati-${{ github.run_id }}
          restore-keys: dati-
      - name: Partite (sito pubblicato) e statistiche per tempo già scaricate
        run: |
          ramo() {   # 19/10/2026: $1 = ramo, $2 = cartella. Ramo che c'è: scaricato (se il download fallisce il giro si ferma);
                     # ramo che non esiste (risposta 2 di ls-remote): cartella vuota; errore di rete o altro: il giro si ferma (mai ripartire da vuoto)
            rc=0; git ls-remote --exit-code origin "$1" >/dev/null 2>&1 || rc=$?
            if [ $rc -eq 0 ]; then git fetch -q --depth 1 origin "$1" && git archive FETCH_HEAD | tar -x -C "$2" || { echo "::error title=Ramo $1::download fallito"; exit 1; }
            elif [ $rc -ne 2 ]; then echo "::error title=Ramo $1::ls-remote fallito (codice $rc)"; exit 1; fi
          }
          mkdir -p tempi
          if [ ! -f data/apif.json ]; then echo "::error title=Tempi::archivio partite (magazzino privato) non trovato"; exit 1; fi
          ramo tempi tempi
          mkdir -p eventi && ramo eventi eventi   # 28/10/2026: eventi con il minuto (cartellini e gol per tempo)
          echo "E0=$(cat eventi/*.json 2>/dev/null | wc -c)" >> "$GITHUB_ENV"
          echo "N0=$(ls tempi/*.json 2>/dev/null | wc -l) S0=$(cat tempi/*.json 2>/dev/null | wc -c)" | tr ' ' '\n' >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Priorità 1 · cartellini e gol per tempo dal 2022 (20 partite per richiesta)
        run: python tools/eventi_apifootball.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      - name: Salva sul ramo eventi
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd eventi
          E1=$(cat *.json 2>/dev/null | wc -c)
          if [ "$E1" -lt "${E0:-0}" ] || [ "$E1" -eq 0 ]; then echo "archivio eventi non salvato ($E0 → $E1 byte)"; exit 0; fi
          git init -q -b eventi && git config user.name "corner-bot" && git config user.email "corner-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Eventi $(date -u '+%F %H:%M')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" eventi
      - name: Priorità 2 · statistiche complete per tempo (nuove partite, poi riscarico dello storico)
        run: python tools/halves_apifootball.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      - name: Salva sul ramo tempi
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd tempi
          S1=$(cat *.json 2>/dev/null | wc -c)
          if [ "$S1" -lt "${S0:-0}" ]; then echo "::error title=Tempi::archivio sceso da $S0 a $S1 byte: ramo NON salvato"; exit 1; fi
          git init -q -b tempi && git config user.name "corner-bot" && git config user.email "corner-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Tempi $(date -u '+%F %H:%M')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tempi
