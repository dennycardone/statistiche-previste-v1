name: Statistiche per tempo API-Football
on:
  workflow_dispatch: {}
  schedule:
    - cron: "40 22 * * *"   # ogni sera usa le richieste avanzate del giorno, finché lo storico non è completo
permissions:
  contents: write
jobs:
  halves:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Archivio partite dal magazzino privato di GitHub Actions (dal 7/10 non è più sul sito pubblico)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: dati-${{ github.run_id }}
          restore-keys: dati-
      - name: Partite (sito pubblicato) e statistiche per tempo già scaricate
        run: |
          mkdir -p tempi
          if [ ! -f data/apif.json ]; then   # riserva: vecchio sito (prima del 7/10 l'archivio era sul ramo pages)
            git fetch -q --depth 1 origin pages && git checkout FETCH_HEAD -- data/apif.json && git reset -q -- data || true
          fi
          if git ls-remote --exit-code origin tempi >/dev/null 2>&1; then
            git fetch -q --depth 1 origin tempi && git archive FETCH_HEAD | tar -x -C tempi
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/halves_apifootball.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      - name: Salva sul ramo tempi
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd tempi
          git init -q -b tempi && git config user.name "corner-bot" && git config user.email "corner-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Tempi $(date -u '+%F %H:%M')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tempi
