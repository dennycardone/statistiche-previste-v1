name: Aggiorna dati corner
on:
  schedule:
    - cron: "17 5-23 * * *"
    - cron: "47 5-22 * * *"   # secondo orario di riserva: GitHub salta spesso i giri programmati, così ne arrivano di più (due giri insieme non partono mai: il secondo aspetta)   # ogni ora dalle 7:17 all'1:17 ora italiana (in UTC; con l'ora solare dalle 6:17 alle 0:17)
  workflow_dispatch: {}
  push:   # parte da solo anche quando cambiano l'app o gli script che preparano i dati
    branches: [main]
    paths: [index.html, precalc.js, update_data.py]
concurrency:   # mai due aggiornamenti insieme
  group: aggiorna-dati
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # sempre l'ultima versione (non quella di quando il giro è stato messo in coda)
      - name: Dati precedenti dal ramo pages (il sito pubblicato; il ramo main non contiene dati)
        run: |
          if git ls-remote --exit-code origin pages >/dev/null 2>&1; then
            git fetch -q --depth 1 origin pages
            rm -rf data && git checkout FETCH_HEAD -- data && git reset -q -- data
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: python update_data.py
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      - name: Previsioni della home
        run: node precalc.js
      - name: Pubblica sul ramo pages (un solo commit, la cronologia non cresce)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf _site && mkdir _site
          cp -r index.html manifest.webmanifest icon.svg data _site/
          touch _site/.nojekyll
          mkdir _site/docs && cp -r index.html manifest.webmanifest icon.svg data _site/docs/ && touch _site/docs/.nojekyll   # copia identica in docs/: il sito funziona sia con la cartella "/ (root)" sia con "/docs" nelle impostazioni di Pages (stessi file, git non occupa spazio in più)
          cd _site
          git init -q -b pages
          git config user.name "corner-bot"
          git config user.email "corner-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Sito $(date -u '+%F %H:%M')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
