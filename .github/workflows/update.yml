name: Aggiorna dati corner
on:
  schedule:
    - cron: "17 5-23 * * *"   # ogni ora dalle 7:17 all'1:17 ora italiana (in UTC; con l'ora solare dalle 6:17 alle 0:17)
  workflow_dispatch: {}
  push:   # parte da solo anche quando cambiano l'app o gli script che preparano i dati
    branches: [main]
    paths: [index.html, precalc.js, update_data.py]
concurrency:   # mai due aggiornamenti insieme
  group: aggiorna-dati
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: python update_data.py
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
      - name: Previsioni della home
        run: node precalc.js
      - name: Commit se ci sono novità
        run: |
          git config user.name "corner-bot"
          git config user.email "corner-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet -- data/*.csv data/crests.json data/espn_stats.json && exit 0
          git commit -m "Aggiornamento dati $(date -u +%F)"
          git pull --rebase origin main
          git push
