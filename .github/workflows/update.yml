name: Aggiorna dati corner
on:
  schedule:
    - cron: "17 5,17 * * *"   # due volte al giorno (UTC)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: python update_data.py
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
      - name: Previsioni della home
        run: node precalc.js
      - name: Commit se ci sono novità
        run: |
          git config user.name "corner-bot"
          git config user.email "corner-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet -- data/*.csv data/crests.json && exit 0
          git commit -m "Aggiornamento dati $(date -u +%F)"
          git push
