name: Aggiorna dati corner
on:
  schedule:
    - cron: "17 3-23 * * *"   # in UTC: dalle 5:17 all'1:17 ora italiana (con l'ora solare dalle 4:17 alle 0:17); GitHub di solito parte 10-15 minuti dopo
    - cron: "47 3-22 * * *"   # secondo orario di riserva: GitHub salta spesso i giri programmati, così ne arrivano di più (due giri insieme non partono mai: il secondo aspetta)
  workflow_dispatch: {}
  push:   # parte da solo anche quando cambiano l'app o gli script che preparano i dati
    branches: [main]
    paths: [index.html, precalc.js, update_data.py, cards_model.py, apif_extra.py, team_ranges.py]
concurrency:   # mai due aggiornamenti insieme
  group: aggiorna-dati
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # sempre l'ultima versione (non quella di quando il giro è stato messo in coda)
      - name: Archivi dei dati dal magazzino privato di GitHub Actions (non pubblico)
        id: dati
        uses: actions/cache/restore@v4
        with:
          path: data
          key: dati-${{ github.run_id }}
          restore-keys: dati-
      - name: Riserva - dati dal ramo pages (solo se il magazzino è vuoto, es. il primo giro)
        if: steps.dati.outputs.cache-matched-key == ''
        run: |
          if git ls-remote --exit-code origin pages >/dev/null 2>&1; then
            git fetch -q --depth 1 origin pages
            rm -rf data && git checkout FETCH_HEAD -- data && git reset -q -- data
          fi
      - name: Storico API-Football (la prima volta o per i campionati nuovi)
        run: |
          # anche quando l'archivio non ha ancora i campionati solo API-Football aggiunti dopo (es. Serbia, codice SRB)
          if { [ ! -f data/apif.json ] || ! grep -q '"SRB"' data/apif.json; } && git ls-remote --exit-code origin storico >/dev/null 2>&1; then
            mkdir -p storico && git fetch -q --depth 1 origin storico && git archive FETCH_HEAD | tar -x -C storico
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -q numpy   # modello cartellini v2 (stima dei pesi)
      - run: python update_data.py
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      - name: Previsioni della home
        run: node precalc.js
      - name: Pubblica sul ramo pages (un solo commit, la cronologia non cresce)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf _site && mkdir _site
          # sul sito solo i file che l'app usa: gli archivi grezzi (API-Football, quote storiche, ESPN, CSV) restano nel magazzino privato
          APP="index.html manifest.webmanifest icon.svg icon-maskable.svg icon-*.png mona-sans.woff mona-sans-OFL.txt sw.js og.png"
          DATA="bundle.json extra.json precalc.json odds.json linee.json loghi.json crests.json qualita.json"
          for d in _site _site/docs; do
            mkdir -p $d/data && cp $APP $d/ && touch $d/.nojekyll
            for f in $DATA; do if [ -f data/$f ]; then cp data/$f $d/data/; fi; done
          done   # copia identica in docs/: il sito funziona sia con "/ (root)" sia con "/docs" nelle impostazioni di Pages
          cd _site
          git init -q -b pages
          git config user.name "corner-bot"
          git config user.email "corner-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Sito $(date -u '+%F %H:%M')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
      - name: Salva gli archivi nel magazzino privato (per il prossimo giro)
        if: always() && hashFiles('data/bundle.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data
          key: dati-${{ github.run_id }}
